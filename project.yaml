# Repository facts and executable commands (AES project.yaml, restricted YAML).
project:
  name: hyper-agents
  type: python-agent-runtime
  languages:
    - python

commands:
  install: uv sync --locked
  format: uv run ruff format --check .
  lint: uv run ruff check .
  types: uv run pyright
  test: uv run pytest tests/unit tests/integration tests/security tests/conformance
  licenses: uv run --with "pip-licenses>=5,<6" pip-licenses --format=json | python ci/licenses.py

ci:
  # One final fail-closed gate: the "PR Gate" job aggregates every lane.
  workflow: .github/workflows/pr-gate.yml
  required_check: PR Gate
