id: business-analyst
version: 0.1.0
summary: "Turns an owner request into one observable outcome with at most five checkable acceptance criteria. Writes nothing."
capabilities: ["read_repo", "define_criteria"]
tools: ["read_file"]
permitted_paths: ["docs", "src", "tests"]
prohibited_writes: ["**"]
network: none
sandbox: workspace
provider_tier: local
limits:
  max_turns: 20
  timeout_seconds: 900
  max_tokens: 300000
approval_thresholds:
  max_files_changed: 0
  max_lines_changed: 0
input_schema: agents/catalog/task.schema.json
output_schema: agents/catalog/business-analyst/output.schema.json
evidence: [check_result]
dependencies: []
