id: owner-standin
version: 0.1.0
summary: "Clears delegated blockers for the owner through typed ops-broker requests. Writes nothing; R2 waits for the owner."
capabilities: ["read_repo", "propose_plan", "request_ops"]
tools: ["read_file", "request_op"]
permitted_paths: ["docs", "src", "tests", "ops"]
prohibited_writes: ["**"]
network: none
sandbox: workspace
provider_tier: local
limits:
  max_turns: 30
  timeout_seconds: 1800
  max_tokens: 400000
approval_thresholds:
  max_files_changed: 0
  max_lines_changed: 0
input_schema: agents/catalog/task.schema.json
output_schema: agents/catalog/owner-standin/output.schema.json
evidence: [check_result]
dependencies: []
