name: PR Verification

# One required check: `PR Gate`. Every lane below must conclude exactly
# `success` on the exact pull-request head, or the gate fails (ci/gate.py).
# No lane uses a paths filter, so every lane reports on every PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: Format, lint, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright

  tests:
    name: Unit, integration, security, conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - run: uv run pytest tests/unit tests/integration tests/security tests/conformance

  licenses:
    name: Dependency license audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --no-dev
      - run: uv run --with "pip-licenses>=5,<6" pip-licenses --format=json | python ci/licenses.py

  tested-head:
    name: Tested head equals PR head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: The checked-out commit is exactly the head under review
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "expected=$HEAD_SHA actual=$actual"
          test "$actual" = "$HEAD_SHA"

  pr-gate:
    name: PR Gate
    needs: [quality, tests, licenses, tested-head]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The rollup runs from the head under review. Until a main ruleset makes
      # `PR Gate` required and CODEOWNERS covers ci/ (owner setup, docs/design/v1.md),
      # a PR can edit its own rollup; test_ci_gate.py pins its lane list to `needs`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
          sparse-checkout: ci/gate.py
          sparse-checkout-cone-mode: false
      - name: Every mandated lane succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | python3 ci/gate.py
