name: Ops broker

# Runs one registered op from ops/registry.yaml. Dispatch-only, and only from main, so a
# new op needs a merged PR first. Inputs reach the shell only through env:, never inline.
# Routing: R0/R1 apply with no environment; R2 apply waits for the ops-r2 environment,
# whose required reviewer is the owner. The plan job needs no credentials.
on:
  workflow_dispatch:
    inputs:
      op:
        description: "Registered op id, e.g. github.secret.set"
        required: true
        type: string
      params:
        description: "JSON object of params for the op"
        required: false
        default: "{}"
        type: string
      mode:
        description: "dry-run plans; apply executes (R2 apply also needs owner approval)"
        required: true
        type: choice
        options: [dry-run, apply]
        default: dry-run

permissions: {}

env:
  UV_VERSION: "0.11.32"

jobs:
  plan:
    name: Plan (tier, dry-run receipt)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      gate: ${{ steps.tier.outputs.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --no-dev
      - name: Resolve the op tier (refuses unregistered ops)
        id: tier
        env:
          OP: ${{ inputs.op }}
        run: |
          set -euo pipefail
          json="$(uv run python -m hyper_agents.ops tier --op "$OP")"
          echo "$json"
          echo "tier=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["tier"])' <<<"$json")" >> "$GITHUB_OUTPUT"
          echo "gate=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["gate"])' <<<"$json")" >> "$GITHUB_OUTPUT"
          if [ "$(python3 -c 'import json,sys; print(json.load(sys.stdin)["tier"])' <<<"$json")" = "R3" ]; then
            echo "::error::R3 ops are not wired yet (needs the ops-r3 environment)"
            exit 1
          fi
      - name: Dry-run receipt
        env:
          OP: ${{ inputs.op }}
          PARAMS: ${{ inputs.params }}
        run: |
          set -euo pipefail
          uv run python -m hyper_agents.ops run --op "$OP" --params "$PARAMS" --mode dry-run \
            | tee /tmp/receipt.json
          {
            echo "### Ops plan"
            echo '```json'
            cat /tmp/receipt.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-r0-r1:
    name: Apply (R0/R1, no environment)
    needs: plan
    if: inputs.mode == 'apply' && needs.plan.outputs.tier != 'R2' && needs.plan.outputs.tier != 'R3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_OPS_IDENTITY_ID: ${{ vars.INFISICAL_OPS_IDENTITY_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --no-dev
      - name: Apply
        env:
          OP: ${{ inputs.op }}
          PARAMS: ${{ inputs.params }}
        run: uv run python -m hyper_agents.ops run --op "$OP" --params "$PARAMS" --mode apply

  apply-r2:
    name: Apply (R2, owner approval via ops-r2)
    needs: plan
    if: inputs.mode == 'apply' && needs.plan.outputs.tier == 'R2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ops-r2
    permissions:
      contents: read
      id-token: write
    env:
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_OPS_IDENTITY_ID: ${{ vars.INFISICAL_OPS_IDENTITY_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --no-dev
      - name: Apply (gated)
        env:
          OP: ${{ inputs.op }}
          PARAMS: ${{ inputs.params }}
          GATE: ops-r2
        run: uv run python -m hyper_agents.ops run --op "$OP" --params "$PARAMS" --mode apply --gate "$GATE"
