name: LLM conversation (AC4 key tier)

# Runs one real LLM conversation in the pinned agent server. Not a PR check: it logs in to
# Infisical with GitHub OIDC, and the identity only trusts this repo's main branch
# (subject repo:kgsmith19/hyper-agents:ref:refs/heads/main). Runs on pushes to main and on
# manual dispatch only. The LLM key is read from Infisical (/dev/, prod) at run time and
# masked; it is never stored in GitHub. No stored client secret is needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  UV_VERSION: "0.11.32"
  # Not secrets: the Infisical project (hyperbolic-core) and the viewer identity (dev-agent)
  # whose OIDC binding accepts this repo's main branch. See agent-extensions#100.
  INFISICAL_PROJECT_ID: 246790d5-245f-4f4a-a730-5dda5e882b05
  INFISICAL_IDENTITY_ID: 3801b514-b70d-45cb-99d2-221f9a9ceb2c

jobs:
  llm-conversation:
    name: One real conversation in the pinned agent server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - name: Fetch the OpenAI dev key from Infisical (OIDC)
        run: python3 ci/fetch_infisical_secret.py DEV_OPENAI_API_KEY LLM_API_KEY
      - name: Run the key-tier test
        run: uv run pytest tests/integration/test_llm_conversation.py -v -rs
