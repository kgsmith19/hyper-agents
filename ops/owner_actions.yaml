# Owner actions: the only steps that need the owner. `owner.actions_status` (run by
# `maintain`) checks each one live and keeps one checklist item current in `tracker.repo`.
# Add a future owner step as one entry here; checks are named in hyper_agents/ops/owner.py.
# `blocker:` is the action's ManualBlocker contract (schemas/manual-blocker.schema.json); the
# live check supplies evidence and status, and two actions may never share a fingerprint.
tracker:
  repo: kgsmith19/hyper-agents
  broker_workflow: ops.yml
  broker_ref: main
  settings_apply_op: repo.settings_apply
  expiry_warning_days: 14

actions:
  - id: ops-token
    title: "Ops token: about 2 minutes, once a year"
    why: >-
      Maintenance needs it to close Issues after merges and to read and enforce repository
      settings in every fleet repository. Administration write is for settings apply; contents
      write is for deleting reconciled branches (lease-checked); secrets, variables and actions
      write are for the Ops broker's R1/R2 ops, each still gated.
    check: forge_access
    blocker:
      blocker_id: MB-002
      provider: github
      capability: fleet maintenance token
      resource: "fine-grained PAT 'hyper-agents ops' (Infisical /ops/GITHUB_OPS_PAT)"
      failure_class: authorization
      attempts:
        - "GitHub Apps were retired (owner decision 2026-11-13), so there is no App token to mint."
        - "GitHub has no API that creates or renews a fine-grained PAT."
      why_human_only: Only the account owner can create or renew a fine-grained personal access token.
      minimum_human_action: Generate the token from the pre-filled link and store it in Infisical.
      required_access: Owner GitHub login and Infisical write on /ops
      safety: The old token keeps working until it expires; a failed new token changes nothing.
      validation: The next maintenance run reads settings and writes Items in all fleet repositories.
      owner: kgsmith19
      source: https://github.com/kgsmith19/hyper-agents/issues/58
    steps:
      - >-
        Open the [pre-filled token page](https://github.com/settings/personal-access-tokens/new?name=hyper-agents+ops&description=hyper-agents+ops+broker+and+fleet+maintenance+%28owner+actions+tracker%29&target_name=kgsmith19&expires_in=366&administration=write&contents=write&issues=write&pull_requests=write&secrets=write&variables=write&actions=write).
        Name, expiry and permissions are filled in.
      - >-
        In **Resource owner**, pick another owner and then `kgsmith19` again (a GitHub bug
        means the pre-fill does not stick otherwise).
      - >-
        Under **Repository access** choose **Only select repositories** and pick the four fleet
        repositories (agent-engineering-standard, agent-extensions, hyperbolic-core,
        hyper-agents). Click **Generate token** and copy it.
      - In Infisical (ops project, environment `prod`, folder `/ops`) set **`GITHUB_OPS_PAT`** to it and save.
      - Nothing else. The next maintenance run (within 30 minutes) ticks this off.

  - id: settings-apply
    title: "Repository settings apply without a reviewer (one-time setting)"
    why: >-
      Declared settings such as delete-branch-on-merge are not enforced yet; reused branches
      then conflict and get no CI. Agents start the settings runs; they must run without a
      human click (owner decision 2026-11-13).
    check: settings_clean
    blocker:
      blocker_id: MB-003
      provider: github
      capability: repository settings apply
      resource: hyper-agents environment ops-r2
      failure_class: approval_gate
      attempts:
        - "Maintenance dispatches one settings-apply run per distinct drift."
        - "The runs waited on the ops-r2 required reviewer."
      why_human_only: Removing a required reviewer is an owner settings change.
      minimum_human_action: Untick Required reviewers on ops-r2 once.
      required_access: Owner admin on hyper-agents
      safety: The environment and its main-only branch rule stay; only the reviewer goes.
      validation: Live settings match the declared profile in every fleet repository.
      owner: kgsmith19
      source: https://github.com/kgsmith19/hyper-agents/issues/58
    steps:
      - >-
        One time: GitHub → hyper-agents → Settings → Environments → `ops-r2` → untick
        **Required reviewers** and save. Keep the environment and its `main` branch rule.
      - >-
        Nothing else. Maintenance starts one settings-apply run per drifting repository, they
        run unattended, and this item ticks itself off once settings match.

  - id: controller-tokens
    title: "LifeOS controller tokens: one approval, then auto-renewing"
    why: >-
      Claude Code (financial_operations, reliability_engineer) and ChatGPT
      (communications, household_operations) each need their own agents:request token
      to ask the LifeOS role gate for decisions (hyperbolic-core #596).
    check: secrets_present
    blocker:
      blocker_id: MB-004
      provider: lifeos
      capability: controller agent tokens
      resource: Infisical /lifeos/agents (CLAUDE_CODE_TOKEN, CHATGPT_TOKEN)
      failure_class: approval_gate
      attempts:
        - "The hyperbolic-core controller mint run is automated and renews every ~25 days."
        - "Its first mint waits on the owner-approval environment by design."
      why_human_only: The first mint establishes trust for two agent identities; the owner approves it once.
      minimum_human_action: Approve the controller-token run once; paste the ChatGPT token into its connector once.
      required_access: Owner approval on hyperbolic-core owner-approval; ChatGPT connector UI
      safety: Tokens are minted straight into the vault and never printed; revoking them in LifeOS is immediate.
      validation: Both names exist at /lifeos/agents and one scoped low-risk request succeeds.
      owner: kgsmith19
      source: https://github.com/kgsmith19/hyperbolic-core/issues/573
    params:
      path: /lifeos/agents
      names: CLAUDE_CODE_TOKEN,CHATGPT_TOKEN
    steps:
      - >-
        When the hyperbolic-core "LifeOS controller tokens" run asks for `owner-approval`,
        click **Review deployments → Approve**. It mints both tokens into Infisical
        `/lifeos/agents` (never printed) and renews them every ~25 days without asking again.
      - >-
        Connect ChatGPT once: paste `/lifeos/agents/CHATGPT_TOKEN` into the LifeOS connector.
        Claude Code picks its token up by itself.

  - id: branch-prune
    title: "Stale branches: one permission edit (or one script run)"
    why: >-
      Reconciled branches (ops/branch_ledger.yaml) pile up and hide the active ones.
      Maintenance deletes each one only while its head is still the recorded SHA, tagging
      superseded work archive/<branch> first. Deleting a branch needs Contents write on the
      ops token, which it does not have yet.
    check: branches_pruned
    blocker:
      blocker_id: MB-008
      provider: github
      capability: branch delete
      resource: fleet branches in ops/branch_ledger.yaml
      failure_class: authorization
      attempts:
        - "repo.branch_prune runs every maintenance run and reports blocked (no Contents write)."
        - "Session pushes reach only the session branch, so a session cannot delete refs."
      why_human_only: Only the owner can widen a fine-grained token's permissions.
      minimum_human_action: Set Contents to Read and write on the existing ops token.
      required_access: Owner GitHub login
      safety: >-
        Deletes only at the recorded SHA, archive tag first where listed, never a branch an open
        change uses; the token value does not change.
      validation: Every ledger branch is gone and archive tags sit at the recorded SHAs.
      owner: kgsmith19
      source: https://github.com/kgsmith19/hyper-agents/issues/72
    steps:
      - >-
        GitHub → Settings → Developer settings → Fine-grained tokens → **hyper-agents ops** →
        Edit. Under Repository permissions set **Contents** to **Read and write** and save.
        The token value does not change, so nothing needs storing again.
      - >-
        Nothing else. The next maintenance run (within 30 minutes) prunes the ledger and this
        item ticks itself off. To prune right away instead, run `scripts/prune-branches.sh`
        once with `gh` signed in as kgsmith19.

  - id: least-privilege-identities
    title: "No workload identity holds Infisical admin"
    why: >-
      ai-coding-harness held the project admin role while serving the ops broker and coding
      sessions. The plan allows no new identities, so least privilege comes from built-in
      roles: member can still read and write secrets but cannot administer the project.
      Maintenance applies this itself through the infisical.identity.set_role op.
    check: identities_least_privilege
    params:
      replacement: member
    resolver:
      op: infisical.identity.set_role
      max_attempts: 2
    blocker:
      blocker_id: MB-009
      provider: infisical
      capability: identity role
      resource: central-vault machine identities
      failure_class: tooling_permission
      attempts:
        - "The resolver dispatches infisical.identity.set_role (R2, ops-r2) per admin identity."
        - "This session's policy refuses direct Infisical role writes."
      why_human_only: Only if the automated role change fails twice in a week.
      minimum_human_action: Set the identity's project role to member in the Infisical UI.
      required_access: Infisical org admin (Kyle)
      safety: >-
        The op never grants admin and reads the role back; member keeps secret read/write so
        the broker keeps working. Kyle's org-admin login is the break-glass path.
      validation: infisical.access.report lists no admin among workload identities.
      owner: kgsmith19
      source: https://github.com/kgsmith19/hyper-agents/issues/76
    steps:
      - >-
        Infisical → central-vault → Access Control → Machine Identities → ai-coding-harness
        (or the identity named above) → change the project role from Admin to Member → Save.
      - Nothing else. The next maintenance run ticks this off.
