# Typed operation registry for the ops broker. Changing this file is a reviewed PR.
# Tiers: R0 read (auto), R1 reversible write (dry-run then apply), R2 secret or live write
# (runs in the `ops-r2` GitHub Environment: OIDC-scoped, main only, no required reviewer).
# Secret values are never parameters. A secret is referenced by Infisical path and name.

ops:
  - id: infisical.secret.exists
    adapter: infisical
    action: exists
    tier: R0
    params:
      - name: source_path
        pattern: '^/[A-Za-z0-9_./-]{0,128}$'
      - name: source_name
        pattern: '^[A-Z][A-Z0-9_]{2,63}$'

  - id: infisical.secret.list_names
    adapter: infisical
    action: list_names
    tier: R0
    params:
      - name: source_path
        pattern: '^/[A-Za-z0-9_./-]{0,128}$'

  # Identity governance (MB-009). R0 report reads names, ids and role slugs only. The R2 op
  # replaces one identity's roles with a single built-in non-admin role and reads it back;
  # the adapter refuses admin whatever the params say.
  - id: infisical.access.report
    adapter: infisical
    action: access_report
    tier: R0
    params: []

  - id: infisical.identity.set_role
    adapter: infisical
    action: set_identity_role
    tier: R2
    gate: ops-r2
    params:
      - name: identity
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      - name: role
        enum: [member, viewer, no-access]

  # Signing-folder boundary (#86, MB-011). Infisical permissions are additive, so the R2 op
  # adds one identity additional privilege (slug lifeos-signing-deny) whose inverted rules
  # forbid readValue on exactly /platform/lifeos-signing; names and metadata stay visible.
  - id: infisical.signing_folder.report
    adapter: infisical
    action: signing_folder_access_report
    tier: R0
    params: []

  - id: infisical.signing_folder.restrict
    adapter: infisical
    action: restrict_signing_folder
    tier: R2
    gate: ops-r2
    params:
      - name: identity
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      - name: rule
        enum: [deny-read-value]

  - id: github.secret.list
    adapter: github
    action: list_secrets
    tier: R0
    params:
      - name: repo
        enum: [kgsmith19/hyper-agents, kgsmith19/agent-extensions]

  - id: github.variable.set
    adapter: github
    action: set_variable
    tier: R1
    params:
      - name: repo
        enum: [kgsmith19/hyper-agents, kgsmith19/agent-extensions]
      - name: name
        pattern: '^[A-Z][A-Z0-9_]{2,63}$'
      - name: value
        pattern: '^[\x20-\x7E]{1,256}$'
        max_length: 256

  - id: github.secret.set
    adapter: github
    action: set_secret
    tier: R2
    gate: ops-r2
    params:
      - name: repo
        enum: [kgsmith19/hyper-agents, kgsmith19/agent-extensions]
      - name: name
        pattern: '^[A-Z][A-Z0-9_]{2,63}$'
      - name: source_path
        pattern: '^/[A-Za-z0-9_./-]{0,128}$'
      - name: source_name
        pattern: '^[A-Z][A-Z0-9_]{2,63}$'

  - id: github.secret.delete
    adapter: github
    action: delete_secret
    tier: R2
    gate: ops-r2
    params:
      - name: repo
        enum: [kgsmith19/hyper-agents, kgsmith19/agent-extensions]
      - name: name
        pattern: '^[A-Z][A-Z0-9_]{2,63}$'

  # P2: live key validation with one cheap read call (GET /v1/models). R0: no write.
  - id: vendor.key.validate
    adapter: vendor
    action: validate_key
    tier: R0
    params:
      - name: provider
        enum: [openai, anthropic]
      - name: source_path
        pattern: '^/[A-Za-z0-9_./-]{0,128}$'
      - name: source_name
        pattern: '^[A-Z][A-Z0-9_]{2,63}$'

  # P3: variables and settings.
  - id: github.variable.list
    adapter: github
    action: list_variables
    tier: R0
    params:
      - name: repo
        enum: [kgsmith19/hyper-agents, kgsmith19/agent-extensions]

  - id: github.variable.delete
    adapter: github
    action: delete_variable
    tier: R1
    params:
      - name: repo
        enum: [kgsmith19/hyper-agents, kgsmith19/agent-extensions]
      - name: name
        pattern: '^[A-Z][A-Z0-9_]{2,63}$'

  - id: github.settings.get
    adapter: github
    action: get_settings
    tier: R0
    params:
      - name: repo
        enum: [kgsmith19/hyper-agents, kgsmith19/agent-extensions]

  # P4: fixed argv allowlist (CLI_ALLOWLIST in adapters.py). Params name a key, never argv.
  - id: cli.run
    adapter: cli
    action: run
    tier: R0
    params:
      - name: command
        enum: [gh-version, git-version]

  # Repository maintenance (provider-neutral; the hosting provider is chosen in ops/fleet.yaml).
  # R0 report reads only. R1 close_sweep and change_health are reversible writes. R2 settings
  # apply changes repository settings through the ops-r2 environment (no reviewer).
  - id: repo.report
    adapter: repo
    action: report
    tier: R0
    params:
      - name: repo
        enum: [kgsmith19/agent-engineering-standard, kgsmith19/agent-extensions, kgsmith19/hyper-agents, kgsmith19/hyperbolic-core]

  - id: repo.settings_drift
    adapter: repo
    action: settings_drift
    tier: R0
    params:
      - name: repo
        enum: [kgsmith19/agent-engineering-standard, kgsmith19/agent-extensions, kgsmith19/hyper-agents, kgsmith19/hyperbolic-core]

  - id: repo.close_sweep
    adapter: repo
    action: close_sweep
    tier: R1
    params:
      - name: repo
        enum: [kgsmith19/agent-engineering-standard, kgsmith19/agent-extensions, kgsmith19/hyper-agents, kgsmith19/hyperbolic-core]

  - id: repo.change_health
    adapter: repo
    action: change_health
    tier: R1
    params:
      - name: repo
        enum: [kgsmith19/agent-engineering-standard, kgsmith19/agent-extensions, kgsmith19/hyper-agents, kgsmith19/hyperbolic-core]

  # R1: lease-checked delete of the branches in ops/branch_ledger.yaml (archive tag first where
  # the ledger says so). Without ref write access it reports `blocked` and writes nothing.
  # R0: branches outside the ledger with no open change (candidates to reconcile); deletes nothing.
  - id: repo.ledger_drift
    adapter: repo
    action: ledger_drift
    tier: R0
    params:
      - name: repo
        enum: [kgsmith19/agent-engineering-standard, kgsmith19/agent-extensions, kgsmith19/hyper-agents, kgsmith19/hyperbolic-core]

  - id: repo.branch_prune
    adapter: repo
    action: branch_prune
    tier: R1
    params:
      - name: repo
        enum: [kgsmith19/agent-engineering-standard, kgsmith19/agent-extensions, kgsmith19/hyper-agents, kgsmith19/hyperbolic-core]

  - id: repo.settings_apply
    adapter: repo
    action: settings_apply
    tier: R2
    gate: ops-r2
    params:
      - name: repo
        enum: [kgsmith19/agent-engineering-standard, kgsmith19/agent-extensions, kgsmith19/hyper-agents, kgsmith19/hyperbolic-core]

  # Owner actions (ops/owner_actions.yaml): live-checked checklist of the few owner-only steps.
  # R1: rewrites one tracker item, posts at most one reminder a week, and starts one
  # settings-apply run (R2, ops-r2 environment, no reviewer) per distinct drift.
  - id: owner.actions_status
    adapter: owner
    action: status
    tier: R1

  # LifeOS controller tokens (MB-004). R2: writes the vault. Creates the ES256 key pair only
  # when neither half exists (never rotates), then mints CLAUDE_CODE_TOKEN and CHATGPT_TOKEN
  # into /lifeos/agents when missing, invalid or within 7 days of expiry. Receipt: names,
  # fingerprints and expiry only.
  - id: lifeos.controller_tokens.renew
    adapter: lifeos
    action: renew
    tier: R2
    gate: ops-r2
    params: []

  # Execution-queue history (agent-engineering-standard#342). R0 runs the Standard's
  # `history --check` and `handoff show`. R2 appends the exact signed copy of a missing event
  # (hash, sequence and both neighbours must match; never fabricated, nothing edited or
  # deleted), then reads history and handoff back. Its resolver runs unattended in ops-r2.
  - id: queue.history_check
    adapter: queue
    action: check
    tier: R0
    params: []

  - id: queue.history_recover
    adapter: queue
    action: recover
    tier: R2
    gate: ops-r2
    params: []
