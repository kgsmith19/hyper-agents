[project]
name = "hyper-agents"
version = "0.1.0"
description = "Owner-controlled, installable multi-agent SDLC engine: owned roles, a deterministic controller, ephemeral sandboxed workers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pyyaml>=6.0.3",
  "typer>=0.12,<1",
]

[project.scripts]
hyper-agents = "hyper_agents.interfaces.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "pyright>=1.1.390,<2",
  "pip-licenses>=5,<6",
  "pyyaml>=6,<7",
  "types-pyyaml>=6,<7",
]
openhands = [
  "openhands-sdk>=1.58.2,<2",
  "openhands-workspace>=1.58.2,<2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyper_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
