services:
  hyper-agents:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    read_only: true
    user: "10001:10001"
    command: ["uv", "run", "hyper-agents", "doctor", "--json"]
    environment:
      HYPER_AGENTS_DATA_DIR: /var/lib/hyper-agents
    tmpfs:
      - /tmp
    volumes:
      - hyper-agents-data:/var/lib/hyper-agents

volumes:
  hyper-agents-data:
